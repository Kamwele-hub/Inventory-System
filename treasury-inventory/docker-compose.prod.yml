version: "3.9"

# Production topology:
#   internet -> proxy (nginx, TLS) -> frontend (static) / backend (gunicorn)
# db, redis, and backend are NOT exposed on host ports -- only proxy is public.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  celery_worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A treasury_inventory worker --loglevel=info
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media

  celery_beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A treasury_inventory beat --loglevel=info
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  media:
  static:
